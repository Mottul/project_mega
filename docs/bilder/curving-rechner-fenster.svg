  <title id="t">Curving-Rechner (uS2+) im kleinen Fenster der App, 880 px breit: Vorschlag für Paket G14</title>
  <desc id="d">Dieselbe Karte wie am Handy, im breiten Fenster in zwei Spalten: links die Antwort (12 Module, 35 Grad, Radius 9,822 m, Sehne 5,893 m, Stichhöhe 0,509 m, Fläche 5,89 × 0,58 m), darunter die Draufsicht über die übrige Höhe und die Winkel je Modul; rechts Form und Vorgabe, die Felder Bogenlänge und Stichhöhe und die Liste der baubaren Stichhöhen mit acht Zeilen. Das Fenster ist rund 510 px hoch. Schmaler als 768 px steht alles in einer Spalte wie am Handy.</desc>
