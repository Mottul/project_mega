<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 216" width="680" role="img" aria-labelledby="t d" font-family="Segoe UI, system-ui, sans-serif">
  <title id="t">Phasen der ATEM-Steuerung</title>
  <desc id="d">Neun Phasen nacheinander, nach Phase 1 ist das Werkzeug bereits im Einsatz nutzbar.</desc>
  <style>
    .a { fill: #faeeda; stroke: #ba7517; }
    .h { fill: #e6f1fb; stroke: #378add; }
    .o { fill: #eaf3de; stroke: #639922; }
    .k { fill: #f4f4f5; stroke: #a1a1aa; }
    .t { fill: #18181b; font-size: 13px; font-weight: 600; }
    .s { fill: #52525b; font-size: 11.5px; }
    @media (prefers-color-scheme: dark) {
      .a { fill: #633806; stroke: #ef9f27; }
      .h { fill: #0c447c; stroke: #85b7eb; }
      .o { fill: #27500a; stroke: #97c459; }
      .k { fill: #27272a; stroke: #52525b; }
      .t { fill: #fafafa; }
      .s { fill: #d4d4d8; }
    }
  </style>
  <rect class="a" x="10" y="14" width="124" height="60" rx="6"/>
  <text class="t" x="72" y="38" text-anchor="middle">0 Probe</text>
  <text class="s" x="72" y="56" text-anchor="middle">Paket, Messungen</text>

  <rect class="o" x="142" y="14" width="124" height="60" rx="6"/>
  <text class="t" x="204" y="38" text-anchor="middle">1 Mischen</text>
  <text class="s" x="204" y="56" text-anchor="middle">Programm, Cut, Hebel</text>

  <rect class="h" x="274" y="14" width="124" height="60" rx="6"/>
  <text class="t" x="336" y="38" text-anchor="middle">2 Mehr Show</text>
  <text class="s" x="336" y="56" text-anchor="middle">Keyer, DSK, Makros</text>

  <rect class="h" x="406" y="14" width="124" height="60" rx="6"/>
  <text class="t" x="468" y="38" text-anchor="middle">3 SuperSource</text>
  <text class="s" x="468" y="56" text-anchor="middle">Boxen, Layouts</text>

  <rect class="h" x="538" y="14" width="132" height="60" rx="6"/>
  <text class="t" x="604" y="38" text-anchor="middle">4 Animation</text>
  <text class="s" x="604" y="56" text-anchor="middle">bildgenaue Wechsel</text>

  <rect class="h" x="10" y="84" width="124" height="60" rx="6"/>
  <text class="t" x="72" y="108" text-anchor="middle">5 Multiview</text>
  <text class="s" x="72" y="126" text-anchor="middle">Bild, Klick schaltet</text>

  <rect class="h" x="142" y="84" width="124" height="60" rx="6"/>
  <text class="t" x="204" y="108" text-anchor="middle">6 Ton</text>
  <text class="s" x="204" y="126" text-anchor="middle">Pegel, Stream</text>

  <rect class="h" x="274" y="84" width="124" height="60" rx="6"/>
  <text class="t" x="336" y="108" text-anchor="middle">7 Seiten</text>
  <text class="s" x="336" y="126" text-anchor="middle">frei belegen</text>

  <rect class="k" x="406" y="84" width="124" height="60" rx="6"/>
  <text class="t" x="468" y="108" text-anchor="middle">8 Handy</text>
  <text class="s" x="468" y="126" text-anchor="middle">PIN zuerst</text>

  <text class="s" x="10" y="172">Ab Phase 1 im Einsatz nutzbar.</text>
  <text class="s" x="10" y="190">Phase 0 entscheidet über Bibliothek und Weg der Animation.</text>
  <text class="s" x="10" y="208">Multiview hängt nur an Phase 1 und lässt sich vorziehen.</text>
</svg>
