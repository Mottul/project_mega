<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 216" width="680" role="img" aria-labelledby="t d" font-family="Segoe UI, system-ui, sans-serif">
  <title id="t">Zwei Wege zum Multiview im Werkzeug</title>
  <desc id="d">Das Bild kommt über den USB-Ausgang des Mischers als Kamera, Fenster und Tally kommen über das Netz.</desc>
  <style>
    .k { fill: #f4f4f5; stroke: #a1a1aa; }
