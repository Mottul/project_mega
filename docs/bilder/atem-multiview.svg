      <path d="M2 1L8 5L2 9" fill="none" stroke="#71717a" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect class="g" x="10" y="44" width="116" height="120" rx="6"/>
  <text class="t" x="68" y="100" text-anchor="middle">ATEM-Mischer</text>
  <text class="s" x="68" y="118" text-anchor="middle">USB und Netzwerk</text>

  <path class="l" d="M126 66H208" marker-end="url(#p)"/>
  <text class="s" x="166" y="58" text-anchor="middle">Bild: USB</text>
  <rect class="k" x="210" y="40" width="120" height="52" rx="6"/>
  <text class="t" x="270" y="62" text-anchor="middle">Kamera-Gerät</text>
  <text class="s" x="270" y="79" text-anchor="middle">ohne Zusatzgerät</text>
  <path class="l" d="M330 66H376" marker-end="url(#p)"/>

  <path class="l" d="M126 146H208" marker-end="url(#p)"/>
