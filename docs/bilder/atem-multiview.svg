    <rect class="k" x="461" y="122" width="59" height="24" rx="2"/>
    <rect class="k" x="528" y="122" width="59" height="24" rx="2"/>
    <rect class="k" x="595" y="122" width="59" height="24" rx="2"/>
    <rect class="k" x="394" y="150" width="59" height="24" rx="2"/>
    <rect class="k" x="461" y="150" width="59" height="24" rx="2"/>
    <rect class="k" x="528" y="150" width="59" height="24" rx="2"/>
