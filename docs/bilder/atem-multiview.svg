  <text class="s" x="270" y="159" text-anchor="middle">Fenster, Tally</text>
  <path class="l" d="M330 146H376" marker-end="url(#p)"/>

  <rect class="o" x="378" y="30" width="292" height="152" rx="6"/>
  <text class="t" x="524" y="50" text-anchor="middle">Seite „Multiview“</text>
  <rect class="k" x="394" y="60" width="126" height="56" rx="2"/>
  <text class="s" x="457" y="92" text-anchor="middle">Programm</text>
  <rect class="k" x="528" y="60" width="126" height="56" rx="2"/>
  <text class="s" x="591" y="92" text-anchor="middle">Vorschau</text>
