  <path d="M528 60h126v56h-126z" fill="none" stroke="#639922" stroke-width="2"/>

  <text class="s" x="524" y="204" text-anchor="middle">Klick auf ein Fenster setzt die Vorschau, Doppelklick schaltet</text>
