<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" width="680" role="img" aria-labelledby="t d" font-family="Segoe UI, system-ui, sans-serif">
  <title id="t">Aufbau der ATEM-Steuerung</title>
