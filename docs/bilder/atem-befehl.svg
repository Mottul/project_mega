<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 150" width="680" role="img" aria-labelledby="t d" font-family="Segoe UI, system-ui, sans-serif">
  <title id="t">Weg eines Befehls</title>
  <desc id="d">Ein Klick wird geprüft und gesendet, der Knopf leuchtet erst, wenn der Mischer den neuen Zustand meldet.</desc>
  <style>
    .k { fill: #f4f4f5; stroke: #a1a1aa; }
    .h { fill: #e6f1fb; stroke: #378add; }
    .g { fill: #faeeda; stroke: #ba7517; }
    .o { fill: #eaf3de; stroke: #639922; }
    .t { fill: #18181b; font-size: 13px; font-weight: 600; }
    .s { fill: #52525b; font-size: 11.5px; }
    .l { stroke: #71717a; fill: none; }
    @media (prefers-color-scheme: dark) {
      .k { fill: #27272a; stroke: #52525b; }
      .h { fill: #0c447c; stroke: #85b7eb; }
      .g { fill: #633806; stroke: #ef9f27; }
      .o { fill: #27500a; stroke: #97c459; }
      .t { fill: #fafafa; }
      .s { fill: #d4d4d8; }
      .l { stroke: #a1a1aa; }
    }
  </style>
  <defs>
    <marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#71717a" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect class="k" x="10" y="20" width="136" height="56" rx="6"/>
  <text class="t" x="78" y="44" text-anchor="middle">Klick</text>
  <text class="s" x="78" y="62" text-anchor="middle">Knopf zeigt „läuft“</text>
  <rect class="h" x="186" y="20" width="136" height="56" rx="6"/>
  <text class="t" x="254" y="44" text-anchor="middle">main prüft</text>
  <text class="s" x="254" y="62" text-anchor="middle">Allowlist, Grenzen</text>
  <rect class="g" x="362" y="20" width="136" height="56" rx="6"/>
  <text class="t" x="430" y="44" text-anchor="middle">Mischer</text>
  <text class="s" x="430" y="62" text-anchor="middle">führt aus, meldet</text>
  <rect class="o" x="534" y="20" width="136" height="56" rx="6"/>
  <text class="t" x="602" y="44" text-anchor="middle">Knopf leuchtet</text>
  <text class="s" x="602" y="62" text-anchor="middle">in allen Fenstern</text>
  <path class="l" d="M146 48H184" marker-end="url(#p)"/>
  <path class="l" d="M322 48H360" marker-end="url(#p)"/>
  <path class="l" d="M498 48H532" marker-end="url(#p)"/>
  <text class="s" x="340" y="112" text-anchor="middle">Der Knopf zeigt, was der Mischer meldet, nie, was gedrückt wurde.</text>
  <text class="s" x="340" y="130" text-anchor="middle">Nach 1 s ohne Meldung: Hinweis statt stiller Abweichung.</text>
</svg>
