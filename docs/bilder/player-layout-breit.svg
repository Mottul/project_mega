    .z { fill: #f4f4f5; stroke: none; }
    .v { fill: #18181b; stroke: #3f3f46; }
    .a { fill: #faeeda; stroke: #ba7517; }
    .af { fill: #ba7517; }
    .t { fill: #18181b; font-size: 12px; }
    .b { fill: #18181b; font-size: 12px; font-weight: 600; }
    .g { fill: #18181b; font-size: 20px; font-weight: 600; }
    .s { fill: #52525b; font-size: 11px; }
    .w { fill: #e4e4e7; font-size: 11px; }
    .m { fill: #71717a; font-size: 10.5px; font-style: italic; }
    .l { stroke: #d4d4d8; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .f { fill: #18181b; stroke: #3f3f46; }
      .k { fill: #1f1f23; stroke: #3f3f46; }
      .z { fill: #27272a; }
      .v { fill: #09090b; stroke: #52525b; }
      .a { fill: #633806; stroke: #ef9f27; }
      .af { fill: #ef9f27; }
      .t, .b, .g { fill: #fafafa; }
      .s { fill: #d4d4d8; }
      .m { fill: #a1a1aa; }
      .l { stroke: #3f3f46; }
    }
  </style>

