<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 392" width="680" role="img" aria-labelledby="t d" font-family="Segoe UI, system-ui, sans-serif">
  <title id="t">Video-Player, breites Fenster: drei Felder nebeneinander</title>
  <desc id="d">Links die Bibliothek, in der Mitte die Playlist, rechts die Bühne mit Vorschau, Restzeit und Transport. Bibliothek und Playlist scrollen in sich, die Seite scrollt nicht.</desc>
  <style>
    .f { fill: #fafafa; stroke: #d4d4d8; }
