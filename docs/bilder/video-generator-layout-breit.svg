<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 392" width="680" role="img" aria-labelledby="t d" font-family="Segoe UI, system-ui, sans-serif">
  <title id="t">Video-Generator, breites Fenster: Storyboard links, rechts Vorschau über Aufträgen</title>
  <desc id="d">Links das Storyboard mit Kacheln und Übergängen, es scrollt in sich; im Kopf Anzahl, Gesamtdauer, Hinzufügen, Ansicht und das Menü mit Sortieren, Mischen und Alle entfernen; im Fuß Zeitlineal und Hinweise, die stehen bleiben. Rechts oben die Vorschau mit Live, Rahmen oder Gerechnet und Vorschau rechnen im Kopf, darunter Bühne, Transport und beim Video der Ausschnitt. Darunter, nur wenn es welche gibt, die Aufträge mit einer Zeile je Auftrag, höchstens drei hoch. Die Seite scrollt nicht.</desc>
  <style>
    .f { fill: #fafafa; stroke: #d4d4d8; }
    .k { fill: #ffffff; stroke: #d4d4d8; }
    .z { fill: #f4f4f5; stroke: none; }
    .v { fill: #18181b; stroke: #3f3f46; }
    .a { fill: #faeeda; stroke: #ba7517; }
    .af { fill: #ba7517; }
    .u { fill: none; stroke: #a1a1aa; stroke-dasharray: 3 2; }
    .t { fill: #18181b; font-size: 12px; }
    .b { fill: #18181b; font-size: 12px; font-weight: 600; }
    .s { fill: #52525b; font-size: 11px; }
    .w { fill: #e4e4e7; font-size: 10.5px; }
    .n { fill: #ffffff; font-size: 8.5px; }
    .m { fill: #71717a; font-size: 10.5px; font-style: italic; }
    .g { fill: #15803d; font-size: 10px; }
    .l { stroke: #d4d4d8; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .f { fill: #18181b; stroke: #3f3f46; }
      .k { fill: #1f1f23; stroke: #3f3f46; }
      .z { fill: #27272a; }
      .v { fill: #09090b; stroke: #52525b; }
      .a { fill: #633806; stroke: #ef9f27; }
      .af { fill: #ef9f27; }
      .u { stroke: #71717a; }
      .t, .b { fill: #fafafa; }
      .s { fill: #d4d4d8; }
      .m { fill: #a1a1aa; }
      .g { fill: #4ade80; }
      .l { stroke: #3f3f46; }
    }
  </style>
  <defs>
    <clipPath id="sb"><rect x="14" y="100" width="380" height="214"/></clipPath>
    <g id="foto"><rect class="k" width="75" height="66" rx="4"/><rect class="v" width="75" height="42" rx="4"/></g>
    <g id="chip"><rect class="u" width="30" height="36" rx="4"/><text class="s" x="15" y="16" text-anchor="middle" style="font-size:10px">⇄</text><text class="s" x="15" y="29" text-anchor="middle" style="font-size:9px">1 s</text></g>
  </defs>

  <rect class="f" x="4" y="4" width="672" height="384" rx="10"/>

  <text class="b" x="18" y="24">Mottulbox</text>
  <text class="s" x="92" y="24">Start</text>
  <text class="b" x="130" y="24">Video-Generator</text>
  <text class="s" x="234" y="24">Einstellungen</text>
  <text class="s" x="662" y="24" text-anchor="end">Eigenes Fenster · Kundenansicht</text>
  <path class="l" d="M4 34H676"/>

  <text class="b" x="18" y="52" style="font-size:10.5px">AUFTRAG</text>
  <rect class="a" x="76" y="42" width="40" height="14" rx="3"/><text class="t" x="96" y="52.5" text-anchor="middle" style="font-size:8.5px;font-weight:600">LÄUFT</text>
  <rect class="a" x="122" y="40" width="102" height="18" rx="4"/><text class="t" x="173" y="53" text-anchor="middle" style="font-size:11px">▶ Video erzeugen</text>
  <text class="s" x="662" y="53" text-anchor="end">Gala-Diashow · 58 %</text>
