  <text class="s" x="26" y="359" style="font-size:10px">ⓘ Foto 04.jpg: 640×480 wird stark vergrößert und wirkt weich.</text>
  <text class="s" x="26" y="372" style="font-size:10px">ⓘ Foto 09.jpg: 640×480 wird stark vergrößert und wirkt weich.</text>

  <!-- Vorschau -->
  <rect class="k" x="404" y="74" width="262" height="244" rx="8"/>
  <text class="b" x="416" y="94">Vorschau</text>
  <rect class="z" x="474" y="83" width="92" height="16" rx="4"/><rect class="k" x="476" y="85" width="34" height="12" rx="3"/>
  <text class="t" x="493" y="94.5" text-anchor="middle" style="font-size:9.5px">Live</text><text class="s" x="538" y="94.5" text-anchor="middle" style="font-size:9.5px">Gerechnet</text>
  <rect class="k" x="574" y="83" width="82" height="16" rx="4"/><text class="s" x="615" y="94.5" text-anchor="middle" style="font-size:9.5px">Vorschau rechnen</text>
