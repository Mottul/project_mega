    <use href="#chip" x="105" y="195"/>
    <rect class="a" x="139" y="178" width="79" height="70" rx="5"/><rect class="v" x="141" y="180" width="75" height="42" rx="4"/>
    <text class="n" x="145" y="190">5</text><text class="b" x="145" y="233" style="font-size:9.5px">Clip Bühne.mp4</text><text class="s" x="145" y="243" style="font-size:9px">4 s · Video</text>
    <use href="#chip" x="220" y="195"/>
    <use href="#foto" x="256" y="180"/><text class="n" x="260" y="190">6</text><text class="s" x="260" y="233" style="font-size:9.5px">Foto 06.jpg</text><text class="s" x="260" y="243" style="font-size:9px">5 s</text>
    <use href="#chip" x="335" y="195"/>

    <use href="#foto" x="26" y="256"/><use href="#chip" x="105" y="271"/>
