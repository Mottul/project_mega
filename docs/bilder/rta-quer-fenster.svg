  <text class="m" x="12" y="490">Dieselbe Anordnung wie am Handy, unter der Kopfleiste des Fensters; Knöpfe für die Maus etwas flacher.</text>
  <text class="m" x="12" y="506">Quer gilt, solange die Fläche breiter als hoch und höchstens 500 px hoch ist – dieselbe Grenze wie K9 am Handy. Dann bestimmt das Fenster die Höhe,</text>
  <text class="m" x="12" y="522">nicht der Inhalt (sonst spränge es beim Umschalten zurück auf hochkant). Wie das Fenster aufgeht, bleibt der RTA hochkant, wie er ist.</text>
