  <title id="t">RTA im kleinen Fenster der App, breit und niedrig</title>
  <desc id="d">Vorschlag für K10: Das Fenster des RTA ist auf 880 × 440 heruntergezogen. Unter der Kopfleiste dieselbe Anordnung wie am Handy quer – links Spektrum und Wasserfall mit gemeinsamer Frequenzachse, rechts die Spalte mit Stopp, Pegel, Ansicht, Bewertung, Einfrieren, Zurücksetzen, Auflösung und Einstellungen.</desc>
