name: Installer bauen

# Fertige Installer je Betriebssystem zum Herunterladen (Actions → dieser Lauf → Artifacts):
# Windows .exe (NSIS), macOS .dmg für Apple Silicon und Intel, Linux .AppImage. Ohne Signatur
# (siehe docs/INSTALL.md) und ohne NDI – das Binding richtet `npm run ndi:setup` nur lokal ein.
# Vor dem Hochladen wird jeder Installer ausgeführt und die App daraus geprüft (e2e/paket.mjs).
#
# Auslöser: von Hand („Run workflow“), bei einem Versions-Tag v* und in Pull Requests, die die
# Paketierung ändern – sonst sähe man einen kaputten Installer erst nach dem Merge.
# Bei einem Tag v* hängt der Job „Release“ die Installer zusätzlich an ein GitHub Release (bleibt,
# anders als die Artifacts, dauerhaft und lädt ohne Anmeldung).
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/installer.yml'
      - 'electron-builder.yml'
      - 'e2e/paket.mjs'

permissions:
  contents: read

concurrency:
  group: installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Installer · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            ziel: --win
            dateien: dist/*.exe
          # Der Runner hat Apple Silicon; das Intel-Paket entsteht daneben (eigene Electron-Binary
          # und das darwin-x64-Binary von better-sqlite3), geprüft wird das passende arm64
          - os: macos-latest
            name: macOS
            ziel: --mac --arm64 --x64
            dateien: dist/*.dmg
          - os: ubuntu-latest
            name: Linux
            ziel: --linux
            dateien: dist/*.AppImage
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
      # Tag und package.json müssen zusammenpassen, sonst trügen die Installer im Release eine
      # andere Versionsnummer als das Release selbst – vor dem Bauen, nicht erst nach 45 Minuten
      - name: Version zum Tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zur Version $version in package.json"
            exit 1
          fi
      - run: npm ci
      # ffmpeg wie in ci.yml: je Woche einmal laden, sonst aus dem Cache (evermeet lässt kurz
      # hintereinander keine zwei Downloads zu)
      - name: Woche für den ffmpeg-Cache
        id: week
        shell: bash
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: resources/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ steps.week.outputs.week }}-${{ hashFiles('scripts/download-ffmpeg.mjs') }}
          restore-keys: |
            ffmpeg-${{ runner.os }}-${{ steps.week.outputs.week }}-
            ffmpeg-${{ runner.os }}-
      - run: node scripts/download-ffmpeg.mjs --max-age 7
      - run: npx electron-vite build
      - name: Installer
        run: npx --yes electron-builder@26 ${{ matrix.ziel }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Nicht dist/*-unpacked, sondern was beim Anwender ankommt: der fertige Installer. Der Runner
      # wird danach verworfen. Unter Windows ist der Pfad nach /D der letzte Parameter, ohne
      # Anführungszeichen. AppImage entpackt sich selbst (der Runner hat kein FUSE).
      - name: Installer ausführen
        shell: bash
        run: |
          set -euo pipefail
          ziel="$RUNNER_TEMP/installiert"
          case "$RUNNER_OS" in
            Windows)
              winziel=$(cygpath -w "$ziel")
              powershell -NoProfile -Command "Start-Process -Wait -FilePath (Get-Item dist/*-setup.exe).FullName -ArgumentList '/S','/D=$winziel'"
              exe="$ziel/Mottulbox.exe"
              ;;
            macOS)
              mkdir -p "$ziel"
              hdiutil attach dist/*-arm64.dmg -nobrowse -mountpoint "$RUNNER_TEMP/dmg"
              cp -R "$RUNNER_TEMP/dmg/Mottulbox.app" "$ziel/"
              hdiutil detach "$RUNNER_TEMP/dmg"
              exe="$ziel/Mottulbox.app/Contents/MacOS/Mottulbox"
              ;;
            Linux)
              mkdir -p "$ziel"
              appimage=$(realpath dist/*.AppImage)
              chmod +x "$appimage"
              (cd "$ziel" && "$appimage" --appimage-extract > /dev/null)
              exe="$ziel/squashfs-root/mottulbox"
              ;;
          esac
          test -f "$exe"
          echo "MOTTULBOX_PAKET_EXE=$exe" >> "$GITHUB_ENV"
      - name: Installierte App starten (virtuelles Display)
        if: runner.os == 'Linux'
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" node e2e/run.mjs paket
      - name: Installierte App starten
        if: runner.os != 'Linux'
        run: node e2e/run.mjs paket
      - name: Übersicht
        shell: bash
        run: |
          {
            echo "### Installer ${{ matrix.name }}"
            echo
            for f in ${{ matrix.dateien }}; do echo "- \`$(basename "$f")\` – $(du -h "$f" | cut -f1)"; done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: Mottulbox-${{ matrix.name }}-${{ github.run_number }}
          path: ${{ matrix.dateien }}
          if-no-files-found: error
          retention-days: 30

  # Nur bei einem Tag v*, und erst wenn alle drei Installer gebaut und zur Probe gestartet sind –
  # scheitert ein System, gibt es kein halbes Release
  release:
    name: Release
    needs: installer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Als einziger Job mit Schreibrecht (Release anlegen, Dateien hochladen)
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: Mottulbox-*-${{ github.run_number }}
          path: dist
          merge-multiple: true
      - name: Release anlegen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          # Genau diese vier Dateien (Namen aus electron-builder.yml) – sonst entstünde bei einem
          # leeren Download ein Release ohne Installer
          dateien=(
            "dist/Mottulbox-$version-setup.exe"
            "dist/Mottulbox-$version-arm64.dmg"
            "dist/Mottulbox-$version-x64.dmg"
            "dist/Mottulbox-$version.AppImage"
          )
          for f in "${dateien[@]}"; do
            [[ -f "$f" ]] || { echo "::error::$f fehlt"; ls -l dist; exit 1; }
          done
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Erneuter Lauf zum selben Tag: Dateien ersetzen, Text und Status bleiben
            gh release upload "$TAG" "${dateien[@]}" --clobber
          else
            # Ein Bindestrich in der Version (v1.0.0-beta.1) macht daraus eine Vorabversion
            vorab=()
            if [[ "$version" == *-* ]]; then vorab=(--prerelease); fi
            gh release create "$TAG" "${dateien[@]}" "${vorab[@]}" --verify-tag \
              --title "Mottulbox $version" --generate-notes \
              --notes "Installer für Windows, macOS (Apple Silicon und Intel) und Linux – nicht signiert und ohne NDI. Installation und Warnungen beim ersten Start: [INSTALL.md](https://github.com/$GH_REPO/blob/$TAG/docs/INSTALL.md)"
          fi
          echo "### Release $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GH_REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
