name: CI

# Mini-CI: bei jedem Push/PR Typecheck, Unit-Tests und Produktions-Build.
# Fängt kaputte Commits automatisch ab, ohne die App zu starten.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Voller Install inkl. postinstall (better-sqlite3-Prebuild + Electron-Binary),
      # damit der Build exakt wie lokal läuft.
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:test
      - run: npm test
      - run: npm run build
