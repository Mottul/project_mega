name: Rechner-PWA

# Baut die Rechner-PWA (vite.pwa.config.ts) und veröffentlicht sie auf GitHub Pages
# (Voraussetzung: Settings -> Pages -> Source „GitHub Actions“).
# - Automatisch bei jedem Push auf main, der die PWA betreffen kann. Die Pfade sind bewusst weit
#   gefasst (alles, was die Rechner über Umwege einbinden: UI-Bausteine, lib, Styles, Pakete): Ein
#   Lauf, der die PWA nicht betrifft, schadet nicht – der Build ist reproduzierbar, und weil ihr
#   CSS nur aus ihren eigenen Quellen kommt (src/pwa/build/sources.ts), bleibt sw.js gleich und
#   die Handys melden keine neue Version.
# - Von Hand: Actions -> Rechner-PWA -> Run workflow.
on:
  push:
    branches: [main]
    paths:
      - 'src/pwa/**'
      - 'src/renderer/src/**'
      - 'src/shared/**'
      - 'vite.pwa.config.ts'
      - 'tailwind.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pwa-pages.yml'
      # Tests landen nicht in der PWA
      - '!**/*.test.ts'
      - '!**/*.test.tsx'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nie zwei Veröffentlichungen gleichzeitig; eine laufende wird nicht abgebrochen
concurrency:
  group: pwa-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Bauen und veröffentlichen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      # Rechenkerne der Rechner und PWA-Tests – nichts Falsches aufs Handy, auch wenn die CI auf
      # main parallel läuft und noch nicht fertig ist
      - run: npx vitest run src/pwa src/renderer/src/tools
      - run: npm run pwa:build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out-pwa
      - id: deployment
        uses: actions/deploy-pages@v5
