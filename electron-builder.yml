appId: com.matthias.avtoolbox
productName: AV Toolbox
copyright: Copyright (c) 2026

directories:
  buildResources: build
  output: dist

files:
  - out/**
  - package.json

# better-sqlite3 wird bereits per postinstall (scripts/rebuild-native.mjs) gegen die
# Electron-ABI vorgebaut -> electron-builder muss/soll nicht selbst rebuilden
# (haelt die node-gyp/tar-Kette auch aus dem Packaging-Schritt heraus).
npmRebuild: false

asar: true
# native Module + ESM-only Pakete duerfen nicht ins asar-Archiv (sonst Laufzeitfehler)
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
  - '**/node_modules/pdfjs-dist/**'

# Pro Zielplattform wird nur das passende ffmpeg-Verzeichnis als Ressource mitgenommen.
# ${os} -> "mac" | "win" | "linux" (siehe scripts/download-ffmpeg.mjs fuer die Ablage).
extraResources:
  - from: resources/ffmpeg/${os}
    to: ffmpeg
    filter:
      - '**/*'
  # Icon zur Laufzeit erreichbar machen (BrowserWindow.icon -> Taskleiste/Fenster).
  - from: build/icon.png
    to: icon.png
  # Optionales NDI-Binding (vendor/grandiose via `npm run ndi:setup`): landet als
  # echte Dateien unter resources/vendor/grandiose (kein asar -> native Module ok).
  # Bewusst ALLOWLIST statt grandiose/**: der Arbeitsbaum enthaelt .git, das
  # komplette NDI-SDK (ndi/), Build-Zwischenprodukte und Setup-only-Deps --
  # hunderte MB, die zur Laufzeit niemand braucht (index.js zieht nur `bindings`;
  # die NDI-Runtime-DLL kopiert der Build nach build/Release). Ohne Setup matcht
  # der Filter nichts; `from: vendor` existiert immer (README).
  - from: vendor
    to: vendor
    filter:
      - 'grandiose/package.json'
      - 'grandiose/index.js'
      - 'grandiose/LICENSE*'
      - 'grandiose/build/Release/**'
      - 'grandiose/node_modules/bindings/**'
      - 'grandiose/node_modules/file-uri-to-path/**'

win:
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}
  # Keine Code-Signierung: ohne Zertifikat wuerde electron-builder dennoch jede .exe
  # signieren wollen (auch die gebuendelten ffmpeg.exe/ffprobe.exe) und dafuer das
  # winCodeSign-Paket laden, dessen Entpacken auf Windows an macOS-Symlinks scheitert
  # ("Dem Client fehlt ein erforderliches Recht"). signAndEditExecutable:false
  # ueberspringt den gesamten Signier-/rcedit-Pfad -> winCodeSign wird nie gebraucht.
  # Kosten: keine Icon-/Versions-Metadaten in der .exe (kosmetisch).
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - dmg
  category: public.app-category.video
  artifactName: ${productName}-${version}.${ext}

linux:
  target:
    - AppImage
  category: AudioVideo
  artifactName: ${productName}-${version}.${ext}
