appId: com.matthias.avtoolbox
productName: AV Toolbox
copyright: Copyright (c) 2026

directories:
  buildResources: build
  output: dist

files:
  - out/**
  - package.json
  # Optionales NDI-Binding (per `npm i --no-save github:rse/grandiose` installiert,
  # steht nicht in dependencies): mitnehmen, WENN es beim Packen vorhanden ist.
  - node_modules/grandiose/**

# better-sqlite3 wird bereits per postinstall (scripts/rebuild-native.mjs) gegen die
# Electron-ABI vorgebaut -> electron-builder muss/soll nicht selbst rebuilden
# (haelt die node-gyp/tar-Kette auch aus dem Packaging-Schritt heraus).
npmRebuild: false

asar: true
# native Module + ESM-only Pakete duerfen nicht ins asar-Archiv (sonst Laufzeitfehler)
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
  - '**/node_modules/pdfjs-dist/**'
  - '**/node_modules/grandiose/**'

# Pro Zielplattform wird nur das passende ffmpeg-Verzeichnis als Ressource mitgenommen.
# ${os} -> "mac" | "win" | "linux" (siehe scripts/download-ffmpeg.mjs fuer die Ablage).
extraResources:
  - from: resources/ffmpeg/${os}
    to: ffmpeg
    filter:
      - '**/*'
  # Icon zur Laufzeit erreichbar machen (BrowserWindow.icon -> Taskleiste/Fenster).
  - from: build/icon.png
    to: icon.png

win:
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}
  # Keine Code-Signierung: ohne Zertifikat wuerde electron-builder dennoch jede .exe
  # signieren wollen (auch die gebuendelten ffmpeg.exe/ffprobe.exe) und dafuer das
  # winCodeSign-Paket laden, dessen Entpacken auf Windows an macOS-Symlinks scheitert
  # ("Dem Client fehlt ein erforderliches Recht"). signAndEditExecutable:false
  # ueberspringt den gesamten Signier-/rcedit-Pfad -> winCodeSign wird nie gebraucht.
  # Kosten: keine Icon-/Versions-Metadaten in der .exe (kosmetisch).
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - dmg
  category: public.app-category.video
  artifactName: ${productName}-${version}.${ext}

linux:
  target:
    - AppImage
  category: AudioVideo
  artifactName: ${productName}-${version}.${ext}
